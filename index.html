:root{--bg:#000000;--panel:#203344;--panel2:#293f51;--muted:#a7b8c7;--white:#f7fafc;--green:#16834a;--green2:#20a663;--red:#a33a36;--line:#405466}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{border:0;cursor:pointer;color:var(--white);touch-action:manipulation}
.app{max-width:560px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:22px;font-weight:900;letter-spacing:1.5px}.tag{font-size:10px;color:var(--muted);letter-spacing:1.5px}
h1{font-size:24px;margin:12px 0 18px}h2{font-size:17px;margin:0 0 12px}
.panel{background:var(--panel);border:1px solid #31485a;border-radius:16px;padding:15px;margin:12px 0}
label{display:block;color:var(--muted);font-size:12px;margin:12px 0 7px}
input,select{width:100%;background:#142330;color:var(--white);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:16px;outline:none}
.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}
.choice{background:var(--panel2);padding:12px 8px;border-radius:10px;font-weight:700}
.choice.active{background:var(--green);box-shadow:0 0 0 2px #42c783 inset}
.primary{background:var(--green);padding:16px;border-radius:12px;font-weight:800;width:100%;margin-top:15px}
.secondary{background:var(--panel2);padding:12px;border-radius:10px;font-weight:700}
.danger{background:var(--red)}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{background:var(--panel);border:1px solid #31485a;border-radius:15px;padding:13px;text-align:center;min-width:0}
.player.active{border:2px solid var(--green2);padding:12px}
.playername{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-size:43px;font-weight:900;line-height:1.2;margin:8px 0}
.meta{font-size:11px;color:var(--muted);line-height:1.8}
.stat-value{display:inline-block;color:#fff;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.2px;text-shadow:0 0 .6px #fff}
.turnpill{display:inline-block;background:#315344;color:#c5ffdf;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:800;margin-top:5px}
.last-visits{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap;margin-top:5px}.last-visits span{background:#142330;border:1px solid #405466;border-radius:5px;padding:3px 4px;min-width:25px;font-size:10px;font-weight:800;color:#e8f0f6}.last-visits .bust{color:#ff9b91;border-color:#8d4944}
.center{text-align:center}.muted{color:var(--muted)}.small{font-size:12px}
.entry{font-size:42px;font-weight:900;text-align:center;padding:8px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.key{background:var(--panel2);border-radius:11px;padding:16px 8px;font-size:22px;font-weight:800;min-height:57px}
.key.ok{background:var(--green)}.key.del{background:#76504a}
.finishrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.finish{background:#7c5a23;padding:14px 5px;border-radius:11px;font-weight:800;min-height:60px;user-select:none;-webkit-user-select:none}
.finish:active{background:#a8792b}
.statsline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #34495a;font-size:13px}
.hidden{display:none!important}.badge{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 12px}
.historyitem{padding:14px 0;border-bottom:1px solid #34495a}
.history-avg-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.history-avg-player{background:#142330;border:1px solid #405466;border-radius:11px;padding:10px;min-width:0;text-align:center}
.history-record-card{cursor:pointer;touch-action:manipulation}
.history-record-card:focus{outline:2px solid #8fa6b8;outline-offset:2px}
.history-record-stats{margin-top:9px;padding-top:8px;border-top:1px solid #405466;text-align:left}
.history-record-stats-row{display:flex;justify-content:space-between;gap:10px;padding:4px 1px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.history-record-stats-row strong{color:#fff;font-size:13px}
.history-avg-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dce7ef}
.history-avg-label{font-size:10px;color:var(--muted);letter-spacing:.7px;margin-top:5px}
.history-avg-value{font-size:25px;line-height:1.2;font-weight:900;color:#fff;margin-top:2px;font-variant-numeric:tabular-nums}
.history-series-card{cursor:pointer}
.history-series-card:focus{outline:2px solid #8fa6b8;outline-offset:2px}
.history-detail{margin-top:12px;padding:12px;border:1px solid #405466;border-radius:11px;background:#0b151e}
.history-detail table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center;font-variant-numeric:tabular-nums}
.history-detail th,.history-detail td{padding:9px 5px;border-bottom:1px solid #34495a}
.history-detail th{font-size:12px;color:#dce7ef;overflow-wrap:anywhere}
.history-detail td{font-size:14px}
.history-detail td:not(:first-child){white-space:nowrap;text-align:center}
.history-leg-cell{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:0;font-variant-numeric:tabular-nums}
.history-leg-winner{display:inline-block;flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#35d06f;box-shadow:0 0 5px rgba(53,208,111,.45)}
.history-detail th:first-child,.history-detail td:first-child{width:54px;color:var(--muted)}
.history-best-darts{font-size:12px;color:var(--muted);margin-top:3px}
.history-best-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:7px;font-size:12px;color:var(--muted);text-align:left}
.history-best-row strong{font-size:16px;line-height:1.2;color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.toast{background:#2d4a3d;border-radius:10px;padding:10px;text-align:center;margin:8px 0;font-size:13px}
footer{color:#7890a3;font-size:10px;text-align:center;margin:20px 0}

<body>
<div class="app">
<header><div><div class="logo">DARTS SCORE</div><div class="tag">PERSONAL SCOREKEEPER</div></div><div class="header-actions"><button class="close-game hidden" id="closeGameBtn" aria-label="Sulge mäng">×</button></div></header>

<main id="setup">
<div class="panel">
<h2>Mängijad</h2>
<label>Mängija 1</label><input id="p1" maxlength="24" value="Mängija 1">
<label>Mängija 2</label><input id="p2" maxlength="24" value="Mängija 2">
</div>
<div class="panel">
<h2>Mänge kokku</h2>
<input id="gamesTotal" aria-label="Mänge kokku" type="number" inputmode="numeric" min="1" max="20" value="3">
<label>Iga mängu legide võitude arv</label><div class="row" id="legsChoices"></div>
<div class="row" id="startChoices"></div>
<div class="row" id="outChoices"></div>
<button class="primary" id="startBtn">START</button>
</div>
<div class="panel"><h2>Salvestatud ajalugu</h2><div id="historyPreview" class="muted small">Mänge pole veel salvestatud.</div><button class="secondary" id="viewHistory" style="width:100%;margin-top:12px">VAATA AJALUGU</button></div>
</main>

<main id="game" class="hidden">

<div class="row" style="align-items:center"><div><div class="tag" id="gameLabel">MÄNG 1 / 3</div><div class="small muted" id="formatLabel">501 · 3 LEGI VÕIDUNI</div></div></div>
<div class="players" style="margin-top:14px" id="players"></div>
<div class="row game-controls"><button class="secondary" id="undoBtn">↶ TAGASI</button><button class="secondary" id="redoBtn">EDASI ↷</button></div>
<div class="panel center entry-panel">
<div class="entry" id="entryDisplay">—</div>
<div id="entryHint" class="muted small" style="margin-top:4px">Sisesta kolme noole summa · hoia 1, 2 või 3 all lõpetamiseks</div>
</div>
<div class="keypad" id="keypad"></div>
</main>

<main id="matchEnd" class="hidden">
<h1 id="winnerTitle">Mäng lõppenud</h1>
<div class="panel" id="matchSummary"></div>
<button class="secondary" id="undoMatchBtn" style="width:100%;margin-top:10px">↶ TAGASI</button><button class="primary" id="nextGameBtn">JÄRGMINE MÄNG</button>
<button class="secondary" id="endSeriesBtn" style="width:100%;margin-top:10px">LÕPETA SEERIA</button>
</main>

<main id="seriesEnd" class="hidden">
<h1>Seeria tulemused</h1><div class="panel" id="seriesSummary"></div>
<button class="primary" id="newSeriesBtn">UUS MÄNGUSEERIA</button>
</main>

<main id="historyScreen" class="hidden">
<h1>Mängude ajalugu</h1>
<button class="secondary" id="backSetup" style="width:100%;margin:0 0 12px">↶ TAGASI</button>
<div class="panel" id="historyList"></div>
</main>
<footer>Andmed salvestatakse selles seadmes.</footer>
</div>
<script>
document.body.classList.toggle('phone-fit',/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||window.matchMedia('(max-width: 700px)').matches);
const $=id=>document.getElementById(id);
let cfg={legs:3,start:501,out:'double'};
let S=null, entry='', undoState=null, undoStack=[], redoStack=[], holdTimer=null, holdFired=false;
let persistent=[];
try{persistent=JSON.parse(localStorage.getItem('dartsHistory')||'[]');if(!Array.isArray(persistent))persistent=[];}catch(e){persistent=[];}
let savedSetup={};
try{savedSetup=JSON.parse(localStorage.getItem('dartsSetup')||'{}')||{};}catch(e){savedSetup={};}
if(savedSetup.names){$('p1').value=savedSetup.names[0]||'Mängija 1';$('p2').value=savedSetup.names[1]||'Mängija 2';}
if(savedSetup.gamesTotal)$('gamesTotal').value=savedSetup.gamesTotal;
function saveSetup(){
 const data={names:[$('p1').value,$('p2').value],gamesTotal:$('gamesTotal').value};
 try{localStorage.setItem('dartsSetup',JSON.stringify(data));}catch(e){}
}
$('p1').addEventListener('input',saveSetup);
$('p2').addEventListener('input',saveSetup);
$('gamesTotal').addEventListener('input',saveSetup);
function save(){try{localStorage.setItem('dartsHistory',JSON.stringify(persistent));}catch(e){}}
function show(id){['setup','game','matchEnd','seriesEnd','historyScreen'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.body.classList.toggle('playing',id==='game');$('closeGameBtn').classList.toggle('hidden',id!=='game');if(id==='historyScreen'||id==='setup')window.scrollTo(0,0);requestAnimationFrame(()=>{fitGameToScreen();updateWakeLock();});} 


function choices(id,values,selected,fn){$(id).innerHTML='';values.forEach(v=>{let b=document.createElement('button');b.className='choice'+(v[0]===selected?' active':'');b.textContent=v[1];b.onclick=()=>fn(v[0]);$(id).appendChild(b);});}
function setupChoices(){
 choices('legsChoices',[1,2,3,4,5,6,7,9,11].map(x=>[x,String(x)]),cfg.legs,v=>{cfg.legs=v;setupChoices();});
 choices('startChoices',[[301,'301'],[501,'501']],cfg.start,v=>{cfg.start=v;setupChoices();});
 choices('outChoices',[['double','Double Out'],['straight','Straight Out']],cfg.out,v=>{cfg.out=v;setupChoices();});
}
setupChoices();
function stat(){return {points:0,darts:0,high:0,visits:0};}
function avg(x){return x.darts?(x.points/x.darts*3).toFixed(2):'0.00';}
function startSeries(){
 saveSetup();
 let n=+$('gamesTotal').value;if(!Number.isInteger(n)||n<1||n>20){alert('Vali 1–20 mängu.');return;}
 let names=[$('p1').value.trim()||'Mängija 1',$('p2').value.trim()||'Mängija 2'];
 S={names,total:n,seriesId:`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,gameNo:1,seriesWins:[0,0],results:[],legs:[0,0],score:[cfg.start,cfg.start],turn:0,setStarter:0,legStarter:0,legStats:[stat(),stat()],gameStats:[stat(),stat()],seriesStats:[stat(),stat()],legHistory:[],visitHistory:[[],[]],visitScores:[[],[]]};
 startGame();show('game');
}
function startGame(){S.legs=[0,0];S.score=[cfg.start,cfg.start];S.turn=S.setStarter??0;S.legStarter=S.turn;S.legStats=[stat(),stat()];S.gameStats=[stat(),stat()];S.legHistory=[];S.visitHistory=[[],[]];S.visitScores=[[],[]];entry='';undoStack=[];redoStack=[];undoState=null;render();}
function gameLegDetails(playerIndex){
 return (S.legHistory||[]).map(leg=>leg.winner===playerIndex?'1':'0').join(' · ') || '–';
}
function fitGameToScreen(){
 const app=document.querySelector('.app');
 if(!app||!document.body.classList.contains('playing'))return;
 if(!window.matchMedia('(max-width: 700px)').matches){app.style.removeProperty('--auto-fit-zoom');return;}
 // Mõõda alati algset, skaleerimata kujundust. Sisestatud punktide arv ei muuda skaalat.
 app.style.setProperty('--auto-fit-zoom','1','important');
 const naturalHeight=app.scrollHeight;
 const viewportHeight=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
 const availableHeight=Math.max(260,viewportHeight-12);
 const scale=Math.min(1,availableHeight/Math.max(1,naturalHeight));
 app.style.setProperty('--auto-fit-zoom',String(Math.max(0.55,scale)),'important');
}
let wakeLock=null;
async function updateWakeLock(){
 const shouldStayAwake=document.body.classList.contains('playing')&&document.visibilityState==='visible';
 if(!shouldStayAwake){if(wakeLock){try{await wakeLock.release();}catch(e){}wakeLock=null;}return;}
 if(!('wakeLock' in navigator)||wakeLock)return;
 try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(e){console.info('Ekraani ärkvelhoidmine pole selles brauseris saadaval:',e);}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')updateWakeLock();else updateWakeLock();});
window.addEventListener('resize',()=>requestAnimationFrame(fitGameToScreen));
window.addEventListener('orientationchange',()=>setTimeout(fitGameToScreen,120));
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>requestAnimationFrame(fitGameToScreen));
function render(){
 $('gameLabel').textContent=`MÄNG ${S.gameNo} / ${S.total}`;
 $('formatLabel').textContent=`${cfg.start} · ${cfg.legs} LEGI VÕIDUNI · ${cfg.out==='double'?'DOUBLE OUT':'STRAIGHT OUT'} · VERSIOON 74`;
 $('players').innerHTML='';
 S.names.forEach((name,i)=>{let d=document.createElement('div');d.className='player'+(S.turn===i?' active':'');let recent=(S.visitHistory?.[i]||[]).slice(-5);d.innerHTML=`<div class="playername">${esc(name)}</div><div class="score">${S.score[i]}</div><div class="meta player-stats"><div class="stat-row"><span>LEGI AVG</span><span class="stat-value">${avg(S.legStats[i])}</span></div><div class="stat-row"><span>MÄNGU AVG</span><span class="stat-value">${avg(S.seriesStats?.[i]||stat())}</span></div><div class="stat-row"><span>LEGI NOOLED</span><span class="stat-value">${S.legStats[i].darts}</span></div><div class="setleg-inline"><span class="stat-label">SETS</span><span class="stat-value">${S.seriesWins[i]}</span><span class="stat-label">LEGS</span><span class="stat-value">${S.legs[i]}</span></div></div><div class="last-visits" aria-label="Viimased viis visketulemust">${Array.from({length:5},(_,j)=>{let value=recent[j]??'–';return `<span class="${value==='BUST'?'bust':''}">${value}</span>`;}).join('')}</div>`;$('players').appendChild(d);d.addEventListener('click',()=>{if(i===S.turn&&entry!=='')submitVisit(true);});});
 $('entryDisplay').textContent=entry||'—';$('entryHint').textContent=entry?'OK = punktid · mängija kast = soovitud jääk · hoia 1, 2 või 3 all lõpetamiseks':'Sisesta punktid või soovitud jääk';
 $('undoBtn').disabled=!undoStack.length;$('undoBtn').style.opacity=undoStack.length?1:.45;
 $('redoBtn').disabled=!redoStack.length;$('redoBtn').style.opacity=redoStack.length?1:.45;

}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function keypad(){
 let vals=['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
 $('keypad').innerHTML='';
 vals.forEach(v=>{
  let b=document.createElement('button');
  b.className='key'+(v==='OK'?' ok':v==='⌫'?' del':'');
  b.textContent=v;
  b.setAttribute('draggable','false');
  b.setAttribute('aria-label',v==='OK'?'Kinnita':v==='⌫'?'Kustuta viimane number':v);
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('selectstart',e=>e.preventDefault());
  let timer=null,held=false,pointerActive=false;
  const activate=()=>{
   if(v==='OK')submitVisit();
   else if(v==='⌫'){
    if(entry.length)redoStack=[];
    entry=entry.slice(0,-1);
   }else if(entry.length<3){
    redoStack=[];
    entry+=v;
   }
   render();
  };
  // Pointer events handle the physical tap once; click is reserved for keyboard/accessibility.
  b.addEventListener('pointerdown',e=>{
   if(e.pointerType==='mouse'&&e.button!==0)return;
   e.preventDefault();
   pointerActive=true;
   held=false;
   try{b.setPointerCapture(e.pointerId);}catch(_){ }
   if(['1','2','3'].includes(v)){
    timer=setTimeout(()=>{
     timer=null;
     held=true;
     finishByDarts(Number(v));
    },550);
   }
  });
  b.addEventListener('pointerup',e=>{
   if(!pointerActive)return;
   e.preventDefault();
   pointerActive=false;
   if(timer){clearTimeout(timer);timer=null;}
   if(!held)activate();
   held=false;
  });
  b.addEventListener('pointercancel',()=>{
   pointerActive=false;
   if(timer){clearTimeout(timer);timer=null;}
   held=false;
  });
  b.addEventListener('click',e=>{
   // Pointer-generated clicks are ignored to avoid duplicate or delayed input.
   if(e.detail!==0)return;
   activate();
  });
  $('keypad').appendChild(b);
 });
}

function snapshot(){return JSON.parse(JSON.stringify({state:S,persistent}));}
function recordVisit(i,value){if(!S.visitHistory)S.visitHistory=[[],[]];S.visitHistory[i].push(value);if(S.visitHistory[i].length>5)S.visitHistory[i].shift();if(typeof value==='number'&&Number.isFinite(value)){if(!S.visitScores)S.visitScores=[[],[]];if(!S.visitScores[i])S.visitScores[i]=[];S.visitScores[i].push(value);}}
function restore(){
 if(!undoStack.length)return;
 redoStack.push(snapshot());
 let previous=undoStack.pop();
 S=previous.state;persistent=previous.persistent;save();
 undoState=undoStack.length?undoStack[undoStack.length-1]:null;
 entry='';show('game');render();
}
function redo(){
 if(!redoStack.length)return;
 undoStack.push(snapshot());
 let next=redoStack.pop();
 S=next.state;persistent=next.persistent;save();
 undoState=undoStack.length?undoStack[undoStack.length-1]:null;
 entry='';show('game');render();
}
function addDarts(i,n){S.legStats[i].darts+=n;S.gameStats[i].darts+=n;}
function submitVisit(asRemaining=false){
 let input=entry===''?0:+entry;
 if(!Number.isInteger(input)||input<0||input>180){alert('Sisesta 0–180.');return;}
 let i=S.turn;
 if(asRemaining&&input>S.score[i]){alert(`Jääk ei saa olla suurem kui praegune skoor (${S.score[i]}).`);return;}
 let v=asRemaining?S.score[i]-input:input;
 if(v>180){alert('Ühe käiguga ei saa sisestada üle 180 punkti.');return;}
 let remaining=S.score[i]-v;redoStack=[];undoStack.push(snapshot());undoState=undoStack[undoStack.length-1];
 if(remaining<0||remaining===1||(remaining===0&&cfg.out==='double')){recordVisit(i,'BUST');addDarts(i,3);S.seriesStats[i].darts+=3;S.legStats[i].visits++;S.gameStats[i].visits++;S.seriesStats[i].visits++;S.turn=1-i;entry='';render();alert('BUST – skoor jääb samaks.');return;}
 if(remaining===0){undoStack.pop();undoState=undoStack.length?undoStack[undoStack.length-1]:null;entry='';alert('Double Out: lõpeta pika vajutusega 1, 2 või 3.');return;}
 recordVisit(i,v);S.score[i]=remaining;S.legStats[i].points+=v;S.gameStats[i].points+=v;S.seriesStats[i].points+=v;S.legStats[i].darts+=3;S.gameStats[i].darts+=3;S.seriesStats[i].darts+=3;S.legStats[i].visits++;S.gameStats[i].visits++;S.seriesStats[i].visits++;S.legStats[i].high=Math.max(S.legStats[i].high,v);S.gameStats[i].high=Math.max(S.gameStats[i].high,v);S.seriesStats[i].high=Math.max(S.seriesStats[i].high,v);S.turn=1-i;entry='';render();
}
function canCheckout(score,darts){
 if(!Number.isInteger(score)||score<=0||!Number.isInteger(darts)||darts<1||darts>3)return false;
 // Kõik ühe noolega tegelikult saavutatavad punktisummad:
 // mööda, single, double, triple, outer bull ja bullseye.
 const dartScores=new Set([0,25,50]);
 for(let n=1;n<=20;n++){dartScores.add(n);dartScores.add(2*n);dartScores.add(3*n);}
 // Double Out: viimane nool peab tabama duublit või bullseye'd.
 const finalScores=cfg.out==='straight'
   ? dartScores
   : new Set([...Array.from({length:20},(_,i)=>(i+1)*2),50]);
 if(darts===1)return finalScores.has(score);
 for(const a of dartScores){
  if(darts===2){if(finalScores.has(score-a))return true;continue;}
  for(const b of dartScores){if(finalScores.has(score-a-b))return true;}
 }
 return false;
}
function finishByDarts(n){
 let score=S.score[S.turn],i=S.turn;
 if(!canCheckout(score,n)){alert(`Skoori ${score} ei saa selle reegli järgi ${n} noolega lõpetada.`);return;}
 redoStack=[];undoStack.push(snapshot());undoState=undoStack[undoStack.length-1];
 S.legStats[i].points+=score;S.gameStats[i].points+=score;S.seriesStats[i].points+=score;
 S.legStats[i].darts+=n;S.gameStats[i].darts+=n;S.seriesStats[i].darts+=n;
 S.legStats[i].visits++;S.gameStats[i].visits++;S.seriesStats[i].visits++;
 recordVisit(i,score);
 S.legStats[i].high=Math.max(S.legStats[i].high,score);S.gameStats[i].high=Math.max(S.gameStats[i].high,score);S.seriesStats[i].high=Math.max(S.seriesStats[i].high,score);
 S.score[i]=0;
 finishLeg(i,n);
}
function finishLeg(winner,darts){
 S.legs[winner]++;S.legHistory.push({winner,stats:S.legStats.map(x=>({...x}))});
 if(S.legs[winner]>=cfg.legs){finishMatch(winner);return;}
 S.score=[cfg.start,cfg.start];S.legStats=[stat(),stat()];S.visitHistory=[[],[]];S.legStarter=1-(S.legStarter??0);S.turn=S.legStarter;undoState=undoStack[undoStack.length-1]||null;render();
}
function finishMatch(winner){
 S.seriesWins[winner]++;
 let result={seriesId:S.seriesId,total:S.total,gameNo:S.gameNo,names:[...S.names],winner,legs:[...S.legs],stats:S.gameStats.map(x=>({...x})),legHistory:S.legHistory.map(x=>({...x})),visitScores:(S.visitScores||[[],[]]).map(x=>[...(x||[])])};
 S.results.push(result);
 // Kui seerias on veel sete, alustame järgmist kohe ilma vahepealse kinnituse või popupita.
 if(S.gameNo<S.total){
  S.gameNo++;
  S.setStarter=1-(S.setStarter??0);
  startGame();
  show('game');
  return;
 }
 finishSeries();
}
function finishSeries(){
 // Ajalukku salvestame ainult täielikult mängitud seeria.
 // Kui valiti näiteks 3 mängu, peavad kõik 3 olema lõpetatud.
 const complete=S.results.length===S.total&&S.results.every((r,i)=>r.gameNo===i+1);
 if(complete&&!S.historySaved){
  const completedAt=new Date().toISOString();
  S.results.forEach(result=>persistent.unshift({date:completedAt,...result}));
  persistent=persistent.slice(0,200);
  S.historySaved=true;
  save();
  $('historyPreview').textContent=`${new Set(persistent.map((h,i)=>h.seriesId||`legacy-${i}`)).size} salvestatud seeriat.`;
 }
 $('seriesSummary').innerHTML=`<h2>${esc(S.names[0])} ${S.seriesWins[0]} : ${S.seriesWins[1]} ${esc(S.names[1])}</h2>`+S.results.map(r=>`<div class="historyitem">Mäng ${r.gameNo}: ${esc(r.names[r.winner])} võitis · ${r.legs.join(' : ')}</div>`).join('')+(complete?'':'<p class="muted small">Seeria jäi pooleli ja seda ajalukku ei salvestatud.</p>');
 show('seriesEnd');
}
function nextGame(){if(S.gameNo>=S.total){finishSeries();return;}S.gameNo++;startGame();show('game');}
$('startBtn').onclick=startSeries;
$('undoBtn').onclick=restore;
$('redoBtn').onclick=redo;
$('undoMatchBtn').onclick=restore;
$('closeGameBtn').onclick=()=>{if(confirm('Katkestan käimasoleva mängu? Seda mängu ei salvestata.'))show('setup');};
$('nextGameBtn').onclick=nextGame;
$('endSeriesBtn').onclick=finishSeries;
$('newSeriesBtn').onclick=()=>show('setup');
function renderHistory(){
 // Koonda ühe mänguseeria kõik lõpetatud mängud üheks ajalookirjeks.
 const groups=new Map();
 persistent.forEach((h,originalIndex)=>{
  const key=h.seriesId?`series:${h.seriesId}`:`legacy:${originalIndex}`;
  if(!groups.has(key))groups.set(key,{key,items:[],indices:[],names:[...(h.names||[])],wins:[0,0],legs:[0,0],stats:[stat(),stat()],detailLegs:[],date:h.date||''});
  const g=groups.get(key);g.items.push(h);g.indices.push(originalIndex);
  if(new Date(h.date||0)>new Date(g.date||0))g.date=h.date;
  (h.names||[]).forEach((name,i)=>{if(name)g.names[i]=name;});
  if(Number.isInteger(h.winner))g.wins[h.winner]++;
  (h.legs||[0,0]).forEach((v,i)=>{g.legs[i]+=Number(v)||0;});
  (h.stats||[]).forEach((v,i)=>{if(!v)return;g.stats[i].points+=Number(v.points)||0;g.stats[i].darts+=Number(v.darts)||0;g.stats[i].high=Math.max(g.stats[i].high,Number(v.high)||0);g.stats[i].visits+=Number(v.visits)||0;});
  (h.legHistory||[]).forEach((leg,legIndex)=>g.detailLegs.push({gameNo:Number(h.gameNo)||1,legNo:legIndex+1,winner:Number.isInteger(leg.winner)?leg.winner:null,stats:leg.stats||[]}));
 });
 const newestFirst=Array.from(groups.values()).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
 const bestByPlayer=new Map();
 newestFirst.forEach(g=>g.names.forEach((name,i)=>{
  if(!name)return;
  const value=Number(avg(g.stats[i]));
  const current=bestByPlayer.get(name);
  const wonLegs=g.detailLegs.filter(leg=>leg.winner===i).map(leg=>leg.stats[i]).filter(st=>st&&Number(st.darts)>0);
  const minDarts=wonLegs.reduce((min,st)=>Math.min(min,Number(st.darts)),Infinity);
  const bestLeg=wonLegs.reduce((best,st)=>{
   const legAvg=Number(avg(st));
   return !best||legAvg>best.value?{value:legAvg,display:avg(st)}:best;
  },null);
  const scores=(g.items||[]).flatMap(item=>(item.visitScores?.[i]||[]).map(Number)).filter(Number.isFinite);
  const visitCounts={};
  scores.forEach(score=>{
   let key=null;
   if(score>=100&&score<=119)key='100+';
   else if(score>=120&&score<=139)key='120+';
   else if(score>=140&&score<=159)key='140+';
   else if(score>=160&&score<=169)key='160+';
   else if(Number.isInteger(score)&&score>=170&&score<=180)key=String(score);
   if(key)visitCounts[key]=(visitCounts[key]||0)+1;
  });
  if(!current){
   bestByPlayer.set(name,{value,display:avg(g.stats[i]),minDarts,bestLeg,visitCounts});
  }else{
   if(value>current.value){current.value=value;current.display=avg(g.stats[i]);}
   if(minDarts<current.minDarts)current.minDarts=minDarts;
   if(bestLeg&&(!current.bestLeg||bestLeg.value>current.bestLeg.value))current.bestLeg=bestLeg;
   Object.entries(visitCounts).forEach(([key,count])=>current.visitCounts[key]=(current.visitCounts[key]||0)+count);
  }
 }));
 const recordOrder=['100+','120+','140+','160+',...Array.from({length:11},(_,n)=>String(170+n))];
 const bestHtml=bestByPlayer.size?`<section class="historyitem" style="margin-bottom:14px"><b>MÄNGIJATE PARIM MÄNGU AVG</b><div class="history-avg-grid" style="margin-top:10px">${Array.from(bestByPlayer.entries()).map(([name,best],playerIndex)=>{const rows=recordOrder.filter(key=>(best.visitCounts[key]||0)>0).map(key=>`<div class="history-record-stats-row"><span>${key}</span><strong>${best.visitCounts[key]}</strong></div>`).join('');return `<div class="history-avg-player history-record-card" role="button" tabindex="0" aria-expanded="false" data-toggle-record="${playerIndex}"><div class="history-avg-name">${esc(name)}</div><div class="history-best-row"><span>AVG</span><strong>${best.display}</strong></div><div class="history-best-row"><span>LEG</span><strong>${best.bestLeg?best.bestLeg.display:'–'}</strong></div><div class="history-best-row"><span>NOOLED</span><strong>${Number.isFinite(best.minDarts)?best.minDarts:'–'}</strong></div><div class="history-record-stats hidden" id="historyRecordStats${playerIndex}">${rows}</div></div>`;}).join('')}</div><div class="muted small" style="margin-top:7px">Vajuta mängija ruudule visketulemuste statistika avamiseks</div></section>`:'';
 const gamesHtml=newestFirst.length?newestFirst.map((g,groupIndex)=>{
  const count=g.items.length;const score=`${g.wins[0]} : ${g.wins[1]}`;
  const outcome=g.wins[0]===g.wins[1]?'Seeria jäi viiki':`${esc(g.names[g.wins[0]>g.wins[1]?0:1])} võitis seeria`;
  const indices=g.indices.join(',');
  const orderedLegs=g.detailLegs.sort((a,b)=>a.gameNo-b.gameNo||a.legNo-b.legNo);
  const detailRows=orderedLegs.map((leg,i)=>`<tr><td>Leg ${i+1}</td>${[0,1].map(player=>{const st=leg.stats[player];const value=st&&Number(st.darts)>0?`${avg(st)} (${Number(st.darts)})`:'–';return `<td><span class="history-leg-cell">${value}${leg.winner===player?'<span class="history-leg-winner" title="Legi võitja" aria-label="Legi võitja"></span>':''}</span></td>`;}).join('')}</tr>`).join('');
  const detailHtml=`<div class="history-detail hidden" id="historyDetail${groupIndex}"><table><thead><tr><th>Leg</th><th>${esc(g.names[0])}</th><th>${esc(g.names[1])}</th></tr></thead><tbody>${detailRows||'<tr><td colspan="3">Legide detailid puuduvad</td></tr>'}</tbody></table></div>`;
  return `<div class="historyitem"><div class="history-series-card" role="button" tabindex="0" aria-expanded="false" data-toggle-detail="${groupIndex}"><b>${outcome}</b> · ${esc(g.names[0])} ${score} ${esc(g.names[1])}<div class="muted small" style="margin-top:5px">${count} mängu · ${new Date(g.date).toLocaleString('et-EE')}</div><div class="muted small" style="margin-top:3px">Legid kokku: ${g.legs[0]} : ${g.legs[1]}</div><div class="history-avg-grid"><div class="history-avg-player"><div class="history-avg-name">${esc(g.names[0])}</div><div class="history-avg-value">${avg(g.stats[0])}</div></div><div class="history-avg-player"><div class="history-avg-name">${esc(g.names[1])}</div><div class="history-avg-value">${avg(g.stats[1])}</div></div></div><div class="muted small" style="margin-top:8px">Vajuta detailide avamiseks</div></div>${detailHtml}<button class="secondary danger" data-delete-series="${indices}" style="width:100%;margin-top:10px">KUSTUTA SEERIA</button></div>`;
 }).join(''):'Ajaloos pole veel mänge.';
 $('historyList').innerHTML=bestHtml+gamesHtml;
 $('historyList').querySelectorAll('[data-toggle-record]').forEach(card=>{
  const toggle=()=>{const detail=$(`historyRecordStats${card.dataset.toggleRecord}`);if(!detail||!detail.innerHTML.trim())return;const opening=detail.classList.contains('hidden');detail.classList.toggle('hidden');card.setAttribute('aria-expanded',String(opening));};
  card.addEventListener('click',toggle);card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle();}});
 });
 $('historyList').querySelectorAll('[data-toggle-detail]').forEach(card=>{
  const toggle=()=>{const detail=$(`historyDetail${card.dataset.toggleDetail}`);const opening=detail.classList.contains('hidden');detail.classList.toggle('hidden');card.setAttribute('aria-expanded',String(opening));};
  card.addEventListener('click',toggle);card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle();}});
 });
 $('historyList').querySelectorAll('[data-delete-series]').forEach(button=>button.addEventListener('click',()=>{
  const indices=button.dataset.deleteSeries.split(',').map(Number).filter(Number.isInteger);
  if(!indices.length)return;
  if(!confirm('Kas kustutan kogu selle mänguseeria ajaloo?'))return;
  indices.sort((a,b)=>b-a).forEach(index=>{if(index>=0&&index<persistent.length)persistent.splice(index,1);});
  save();renderHistory();$('historyPreview').textContent=persistent.length?`${new Set(persistent.map((h,i)=>h.seriesId||`legacy-${i}`)).size} salvestatud seeriat.`:'Mänge pole veel salvestatud.';
 }));
}
$('viewHistory').onclick=()=>{renderHistory();show('historyScreen');window.scrollTo(0,0);};
$('backSetup').onclick=()=>show('setup');
keypad();
$('historyPreview').textContent=persistent.length?`${persistent.length} salvestatud mängu.`:'Mänge pole veel salvestatud.';
